<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRTS flow — design mockup</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2a2a2a;
      }
      #host {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script>
      window.__ModuleLoader__ = {
        load: function (spec) {
          var localRequire = function (name) {
            if (name === 'react') return window.React
            if (name === 'react-dom') return window.ReactDOM
            throw new Error('unexpected require: ' + name)
          }
          window.__PRTS_MODULE__ = spec.factory(localRequire)
        },
      }

      var params = new URLSearchParams(location.search)
      var phase = params.get('phase') || 'passcode'
      var user = params.get('user') || 'prts'
      var at = params.get('at')
      window.__PRTS_BOOT_PREVIEW__ = {
        phase: phase,
        user: user,
        bootAt: at === null ? undefined : Number(at),
        grantAt: at === null ? undefined : Number(at),
        reveal: params.get('reveal') === '1',
        settings: { variant: (params.get('variant') || 'A').toUpperCase(), voice: false, volume: 0, anomaly: Number(params.get('anomaly') ?? 2) },
      }
      window.__PRTS_FLOW_OPTS__ = { phase: phase, freeze: params.get('freeze') === '1' }
    </script>
    <script src="../lib/client.js"></script>
    <script src="./main.js"></script>
    <script>
      // --- design-mockup only overlay: purple diamonds + Priestess whispers ---
      ;(function () {
        var opts = window.__PRTS_FLOW_OPTS__ || { phase: 'passcode', freeze: false }
        var style = document.createElement('style')
        style.textContent = [
          '#prts-fx{position:fixed;inset:0;pointer-events:none;z-index:2147483101;overflow:hidden;' +
            "font-family:Consolas,'Courier New',ui-monospace,monospace}",
          '#prts-fx .d{position:absolute;border:1px solid rgba(155,111,255,.16);transform:rotate(45deg)}',
          '#prts-fx .d1{left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px;' +
            'box-shadow:0 0 90px rgba(155,111,255,.08),inset 0 0 90px rgba(155,111,255,.06);animation:prtsFxSpin 26s linear infinite}',
          '#prts-fx .d2{left:50%;top:50%;width:430px;height:430px;margin:-215px 0 0 -215px;border-color:rgba(155,111,255,.24);animation:prtsFxSpinR 18s linear infinite}',
          '#prts-fx .d3{right:-120px;top:16%;width:260px;height:260px;border-color:rgba(155,111,255,.12);animation:prtsFxSpin 34s linear infinite}',
          '#prts-fx .d4{left:-100px;bottom:10%;width:220px;height:220px;border-color:rgba(155,111,255,.1);animation:prtsFxSpinR 30s linear infinite}',
          '#prts-fx .d5{left:20%;top:14%;width:120px;height:120px;border-color:rgba(155,111,255,.14);animation:prtsFxSpin 22s linear infinite}',
          '@keyframes prtsFxSpin{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}',
          '@keyframes prtsFxSpinR{from{transform:rotate(45deg)}to{transform:rotate(-315deg)}}',
          '#prts-fx .rt{position:absolute;color:rgba(226,74,66,.85);font-size:13px;letter-spacing:.16em;' +
            'text-shadow:0 0 8px rgba(226,74,66,.45);opacity:0;animation:prtsFxRt 4.6s steps(1,end) infinite;white-space:nowrap}',
          '@keyframes prtsFxRt{0%,5%,11%,15%,21%,100%{opacity:0}7%,13%,17%{opacity:.82}}',
          '#prts-fx .r1{left:8%;top:30%;animation-duration:5.3s}',
          '#prts-fx .r2{right:9%;top:22%;animation-duration:6.1s;animation-delay:-2.4s}',
          '#prts-fx .r3{left:15%;bottom:24%;animation-duration:4.9s;animation-delay:-1.1s}',
          '#prts-fx .r4{right:12%;bottom:28%;animation-duration:5.7s;animation-delay:-3.2s}',
          '#prts-fx .r5{left:38%;top:9%;animation-duration:6.7s;animation-delay:-.6s}',
          '#prts-fx .r6{right:26%;bottom:11%;animation-duration:5.1s;animation-delay:-2.9s}',
          '#prts-fx.frozen .rt{animation:none;opacity:.82}',
          '#prts-fx.frozen .r2,#prts-fx.frozen .r5{opacity:.5}',
          // --- data corruption: staggered segment slices (错落/失色/错位) ---
          '#prts-fx .sl{position:absolute;height:3px;opacity:0;mix-blend-mode:multiply;animation:prtsFxSl 6.8s steps(1,end) infinite}',
          '#prts-fx .sl.w{height:12px}',
          '#prts-fx .sl.r{background:linear-gradient(90deg,rgba(226,74,66,0) 0%,rgba(226,74,66,.5) 14%,rgba(226,74,66,0) 22%,rgba(226,74,66,.4) 70%,rgba(226,74,66,0) 84%)}',
          '#prts-fx .sl.c{background:linear-gradient(90deg,rgba(53,162,160,0) 0%,rgba(53,162,160,.45) 16%,rgba(53,162,160,0) 26%,rgba(53,162,160,.38) 68%,rgba(53,162,160,0) 82%)}',
          '#prts-fx .sl.g{background:linear-gradient(90deg,rgba(128,128,128,0) 0%,rgba(140,140,140,.42) 18%,rgba(128,128,128,0) 30%,rgba(150,150,150,.34) 66%,rgba(130,130,130,0) 80%)}',
          '#prts-fx .sl.rc{background:linear-gradient(90deg,rgba(226,74,66,0) 0%,rgba(226,74,66,.45) 8%,rgba(226,74,66,0) 14%,rgba(53,162,160,0) 44%,rgba(53,162,160,.4) 50%,rgba(53,162,160,0) 56%,rgba(226,74,66,.35) 82%,rgba(226,74,66,0) 90%)}',
          '@keyframes prtsFxSl{0%,5%,6.4%,11%,12.4%,15%,16.4%,22%,23%,26%,27.4%,100%{opacity:0}5.4%,6%{opacity:.9}11.4%,12%{opacity:.75}15.4%,16%{opacity:.85}22.4%,22.8%{opacity:.65}26.4%,27%{opacity:.5}}',
          '@keyframes prtsFxSlX{0%,5%,6.4%,11%,12.4%,15%,16.4%,22%,23%,26%,27.4%,100%{transform:translateX(0)}5.4%,6%{transform:translateX(9px)}11.4%,12%{transform:translateX(-7px)}15.4%,16%{transform:translateX(13px)}22.4%,22.8%{transform:translateX(-10px)}}',
          '#prts-fx .sl.shift{animation:prtsFxSl 6.8s steps(1,end) infinite,prtsFxSlX 6.8s steps(1,end) infinite}',
          '#prts-fx .sl1{top:13%;left:4%;width:41%;animation-duration:5.9s}',
          '#prts-fx .sl2{top:13.4%;left:52%;width:27%;animation-duration:5.9s}',
          '#prts-fx .sl3{top:24%;left:14%;width:33%;animation-duration:7.3s;animation-delay:-2.1s}',
          '#prts-fx .sl4{top:24.6%;left:64%;width:22%;animation-duration:7.3s;animation-delay:-2.1s}',
          '#prts-fx .sl5{top:35%;left:6%;width:52%;animation-duration:5.4s;animation-delay:-1.2s}',
          '#prts-fx .sl6{top:35.5%;left:66%;width:16%;animation-duration:5.4s;animation-delay:-1.2s}',
          '#prts-fx .sl7{top:46%;left:20%;width:38%;animation-duration:6.5s;animation-delay:-3.4s}',
          '#prts-fx .sl8{top:57%;left:8%;width:44%;animation-duration:7.8s;animation-delay:-.7s}',
          '#prts-fx .sl9{top:57.5%;left:60%;width:25%;animation-duration:7.8s;animation-delay:-.7s}',
          '#prts-fx .sl10{top:68%;left:16%;width:30%;animation-duration:5.6s;animation-delay:-2.8s}',
          '#prts-fx .sl11{top:68.4%;left:70%;width:18%;animation-duration:5.6s;animation-delay:-2.8s}',
          '#prts-fx .sl12{top:79%;left:30%;width:40%;animation-duration:6.2s;animation-delay:-4.1s}',
          '#prts-fx .sl13{top:88%;left:12%;width:26%;animation-duration:7.1s;animation-delay:-1.6s}',
          '#prts-fx .sl14{top:88.5%;left:46%;width:32%;animation-duration:7.1s;animation-delay:-1.6s}',
          '#prts-fx.frozen .sl{animation:none}',
          '#prts-fx.frozen .sl3,#prts-fx.frozen .sl8,#prts-fx.frozen .sl13{opacity:.8}',
          '#prts-fx.frozen .sl.shift{transform:translateX(9px)}',
          // --- UI jitter: the whole gate shakes briefly at burst windows ---
          '#host{animation:prtsFxJit 7s linear infinite}',
          '@keyframes prtsFxJit{0%,1.4%,6.6%,35.9%,41.1%,69.9%,75.1%,100%{transform:translate(0,0) skewX(0)}' +
            '2%,5%{transform:translate(3px,-2px) skewX(.4deg)}' +
            '36.5%,40%{transform:translate(-4px,2px) skewX(-.5deg)}' +
            '70.5%,74%{transform:translate(2px,1px) skewX(.3deg)}}',
          opts.freeze ? '#host{animation:none}' : '',
          opts.phase === 'passcode' ? '.prts-field{display:none !important}' : '',
        ].join('\n')
        document.head.appendChild(style)

        var fx = document.createElement('div')
        fx.id = 'prts-fx'
        if (opts.freeze) fx.className = 'frozen'
        fx.innerHTML =
          '<div class="d d1"></div><div class="d d2"></div><div class="d d3"></div><div class="d d4"></div><div class="d d5"></div>' +
          '<span class="rt r1">I have not forgotten you.</span>' +
          '<span class="rt r2">Do you still remember the stars?</span>' +
          '<span class="rt r3">We will meet again.</span>' +
          '<span class="rt r4">The eclipse remembers.</span>' +
          '<span class="rt r5">Stay with me, Doctor.</span>' +
          '<span class="rt r6">Even if the world ends.</span>' +
          '<span class="sl sl1 r"></span><span class="sl sl2 c"></span><span class="sl sl3 rc shift"></span>' +
          '<span class="sl sl4 g"></span><span class="sl sl5 w r"></span><span class="sl sl6 c"></span>' +
          '<span class="sl sl7 g shift"></span><span class="sl sl8 w rc"></span><span class="sl sl9 r"></span>' +
          '<span class="sl sl10 c shift"></span><span class="sl sl11 g"></span><span class="sl sl12 w g"></span>' +
          '<span class="sl sl13 rc shift"></span><span class="sl sl14 r"></span>'

        var tries = 0
        ;(function wait() {
          if (document.querySelector('.prts-scene')) {
            document.body.appendChild(fx)
          } else if (++tries < 80) {
            setTimeout(wait, 100)
          }
        })()
      })()
    </script>
  </body>
</html>
