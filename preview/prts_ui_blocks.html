<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />

    <title>PRTS geo blocks bg — mock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        overflow: hidden;
      }
      .app {
        position: relative;
        z-index: 1;
        display: flex;
        height: 100vh;
        background: var(--dsw-alias-bg-base, #f2f1ee);
        color: var(--dsw-alias-label-primary, #12120f);
      }
      .sidebar {
        width: 262px;
        flex: 0 0 auto;
        background: var(--dsw-specific-sidebar-fill, rgba(246, 244, 239, 0.62));
        display: flex;
        flex-direction: column;
        padding: 14px 12px;
        gap: 2px;
        box-sizing: border-box;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 18px;
      }
      .brand .mark {
        width: 26px;
        height: 26px;
        background: var(--dsw-alias-brand-primary, #3f45c9);
        border-radius: 7px;
      }
      .brand .name {
        font-weight: 700;
        font-size: 14px;
      }
      .treeitem {
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: var(--dsw-alias-label-secondary, #4c4b45);
      }
      .treeitem[aria-selected='true'] {
        background: var(--dsw-alias-interactive-bg-active, rgba(17, 17, 16, 0.09));
        color: var(--dsw-alias-label-primary, #12120f);
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .phasebar {
        padding: 16px 24px 8px;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: var(--dsw-alias-label-tertiary, #6f6d66);
      }
      .scroll {
        flex: 1;
        overflow: auto;
        padding: 8px 24px 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 780px;
      }
      .assistant {
        display: flex;
        gap: 12px;
      }
      .bubble {
        background: var(--dsw-specific-bubble, #faf8f3);
        border-radius: 4px 14px 14px 14px;
        padding: 14px 18px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--dsw-alias-label-primary, #12120f);
      }
      .tool {
        margin-top: 10px;
        padding: 8px 12px;
        border: 1px solid var(--dsw-alias-border-l2, #e3e1da);
        border-radius: 10px;
        font-size: 12px;
        color: var(--dsw-alias-label-secondary, #4c4b45);
        display: inline-block;
      }
      .composer {
        padding: 10px 24px 22px;
      }
      .composer .composer-card[data-composer-card] {
        border: none;
        background: transparent;
        border-bottom: 1px solid rgba(17, 17, 16, 0.16);
        border-radius: 0;
        padding: 12px 2px;
        font-size: 13px;
        color: var(--dsw-alias-label-tertiary, #6f6d66);
        transition: border-color 0.18s ease;
      }
      .composer .composer-card[data-composer-card]::before {
        content: '◇';
        margin-right: 9px;
        font-size: 11px;
        color: var(--dsw-alias-brand-primary, #3f45c9);
      }
      .composer .composer-card[data-composer-card]:focus-within {
        border-bottom-color: var(--dsw-alias-brand-primary, #3f45c9);
      }
      .composer-card .kbd {
        border: 1px solid var(--dsw-alias-border-l2, #e3e1da);
        border-radius: 5px;
        padding: 1px 6px;
        margin-left: 8px;
        font-size: 11px;
      }
      html[data-prts-skin='B'] .composer .composer-card[data-composer-card] {
        border-bottom-color: rgba(244, 242, 236, 0.2);
      }
      html[data-prts-skin='B'] .composer .composer-card[data-composer-card]::before {
        color: #41d6d6;
      }

      /* ---- bottom-left PRTS logo (clickable → PRTS settings) ---- */
      .prts-ui-logo {
        position: fixed;
        left: 20px;
        bottom: 16px;
        z-index: 2147482000;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 12px 7px 8px;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--dsw-alias-label-secondary, #4c4b45);
        text-decoration: none;
        font-family: 'Courier New', monospace;
        transition: color 0.18s ease;
      }
      .prts-ui-logo .prts-ui-logo-mark {
        width: 15px;
        height: 15px;
        border: 1.5px solid currentColor;
        transform: rotate(45deg);
        flex: 0 0 auto;
      }
      .prts-ui-logo .prts-ui-logo-word {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--dsw-alias-label-primary, #12120f);
      }
      .prts-ui-logo .prts-ui-logo-sub {
        font-size: 10px;
        letter-spacing: 0.18em;
        opacity: 0.55;
      }
      .prts-ui-logo:hover {
        color: var(--dsw-alias-brand-primary, #3f45c9);
      }
      .prts-ui-logo:active {
        transform: translateY(1px);
      }
      html[data-prts-skin='B'] .prts-ui-logo .prts-ui-logo-word {
        color: #e8e8e4;
      }
      html[data-prts-skin='B'] .prts-ui-logo:hover {
        color: #41d6d6;
      }

      /* ---- dark-mode mock theming for skin B (real app resolves these
         vars from the DSH theme; the mock defines them locally) ---- */
      html[data-prts-skin='B'] {
        --dsw-alias-bg-base: #0a0a0b;
        --dsw-alias-label-primary: #e8e8e4;
        --dsw-alias-label-secondary: #9c9c96;
        --dsw-alias-label-tertiary: #6e6e6a;
        --dsw-alias-border-l1: #1f1f25;
        --dsw-alias-border-l2: #26262c;
        --dsw-specific-sidebar-fill: rgba(14, 16, 21, 0.66);
        --dsw-specific-bubble: #14161a;
        --dsw-specific-input-major: #121418;
        --dsw-alias-brand-primary: #41d6d6;
        --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.08);
      }
      html[data-prts-skin='B'] .prts-ui-grid {
        background-image: linear-gradient(rgba(244, 242, 236, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 242, 236, 0.05) 1px, transparent 1px);
      }
      html[data-prts-skin='B'] .prts-ui-mark {
        -webkit-text-stroke: 1px rgba(244, 242, 236, 0.13);
      }
      html[data-prts-skin='B'] .prts-ui-corner {
        border-color: rgba(244, 242, 236, 0.26);
      }
      html[data-prts-skin='B'] .prts-ui-vig {
        background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0, 0, 0, 0.55) 100%);
      }

      /* ---- geometric composite layer (behind the shell, z 0) ---- */
      .prts-ui-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .prts-ui-geo {
        position: absolute;
        left: var(--geo-left, 56%);
        top: var(--geo-top, 50%);
        width: min(120vh, 118%);
        transform: translate(-50%, -50%);
        opacity: var(--geo-op, 1);
      }
      .prts-ui-geo svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      /* Parallax & idle motion are driven by rAF writing plain `transform`
         ATTRIBUTES on inner SVG groups (reliable in headless captures and
         live alike). NOTE: the `op` param is a PERCENT (op=100 = full). */
      .blk {
      }

      /* idle motion: handled in JS (see rAF loop at the bottom). */

      .prts-ui-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(17, 17, 16, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 17, 16, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        transform: translate3d(calc(var(--wx, 0) * var(--geo-par, 1) * -5px), calc(var(--wy, 0) * var(--geo-par, 1) * -4px), 0);
        transition: transform 0.16s linear;
      }
      .prts-ui-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) translate3d(calc(var(--wx, 0) * var(--geo-par, 1) * 11px), calc(var(--wy, 0) * var(--geo-par, 1) * 7px), 0);
        font-size: 88px;
        letter-spacing: 0.42em;
        font-weight: 700;
        color: transparent;
        -webkit-text-stroke: 1px rgba(17, 17, 16, 0.14);
        transition: transform 0.16s linear;
        user-select: none;
      }
      .prts-ui-corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(17, 17, 16, 0.18);
      }
      .prts-ui-corner.a {
        left: 18px;
        top: 18px;
        border-right: 0;
        border-bottom: 0;
      }
      .prts-ui-corner.b {
        right: 18px;
        bottom: 18px;
        border-left: 0;
        border-top: 0;
      }
      .prts-ui-vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(17, 17, 16, 0.07) 100%);
      }
      @media (prefers-reduced-motion: reduce) {
        .blk,
        .prts-ui-grid,
        .prts-ui-mark {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <span data-shell-overlay></span>
      <div class="sidebar">
        <div class="brand">
          <div class="mark" data-slot="sidebar.brand.mark"></div>
          <div class="name" data-slot="sidebar.brand.name">PRTS Agent</div>
        </div>
        <div class="treeitem">◇ 新会话</div>

        <div class="treeitem">语音与音效</div>
      </div>
      <div class="content">
        <div class="phasebar" data-phase="active">ACTIVE SESSION — 设计 PRTS 启动插件</div>
        <div class="scroll" data-conversation-scroll>
          <div class="msg" data-chat-flow-kind="assistant-step">

            </div>
            <div class="tool" data-tool data-state="running"><span class="state">● 执行中</span> — 正在加载会话上下文…</div>
          </div>
        </div>
        <div class="composer" data-composer-seat>
          <div class="composer-card" data-composer-card>发消息或创建任务 · 调用命令，@ 文件或对话 <span class="kbd">Enter</span> 发送</div>
        </div>
      </div>
    </div>

    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script>
      window.__ModuleLoader__ = {

    <script src="../lib/client.js"></script>
    <script>
      var params = new URLSearchParams(location.search)
      var skin = (params.get('skin') || 'A').toUpperCase()
      var op = params.get('op') !== null ? Number(params.get('op')) / 100 : 1
      var par = params.get('par') !== null ? Number(params.get('par')) : 2
      var geoLeft = params.get('left') || '58%'
      var geoTop = params.get('top') || '50%'
      var mx = params.get('mx') !== null ? Number(params.get('mx')) : 0
      var my = params.get('my') !== null ? Number(params.get('my')) : 0
      var animate = params.get('animate') === '1'
      if (params.get('clean') === '1') document.body.classList.add('clean')

      window.__PRTS_MODULE__.apply({
        slots: {
          inject: function () {},
          register: function () {
            return function () {}
          },
        },
      })
      var root = document.documentElement
      root.dataset.prtsSkin = skin
      root.dataset.prtsVariant = skin
      root.dataset.prtsHero = '0'
      root.dataset.prtsUi = skin
      root.dataset.prtsUiBg = '1'
      root.dataset.prtsUiChat = params.get('chat') !== '0' ? '1' : '0'
      root.dataset.prtsUiPanels = params.get('panels') !== '0' ? '1' : '0'

      /* ---- geometry palettes (fit of the mpkg wallpapers) ----
         A / light: ink lines on paper, thin teal·violet·amber accents, dark core.
         B / dark:  glowing core, magenta·cyan·amber accents, dark rings. */
      var PAL = {
        A: {
          coreFill: 'rgba(20,22,26,0.92)',
          coreEdge: 'rgba(20,22,26,0)',
          band: 'rgba(23,26,30,0.10)',
          band2: 'rgba(23,26,30,0.07)',
          ring: 'rgba(23,26,30,0.30)',
          ringFaint: 'rgba(23,26,30,0.16)',
          acc1: '#2a6b64',
          acc2: '#3f45c9',
          acc3: '#b07a2f',
          acc4: '#c14b3f',
          redEdge: '#b13b32',
          redFill: 'rgba(193,75,63,0.14)',
          frag: 'rgba(23,26,30,0.5)',
          fragFill: 'rgba(244,242,236,0.85)',
          glitchR: 'rgba(193,75,63,0.5)',
          glitchC: 'rgba(45,143,155,0.45)',
          text: 'rgba(23,26,30,0.34)',
        },
        B: {
          coreFill: 'rgba(244,242,236,0.94)',
          coreEdge: 'rgba(255,91,140,0.55)',
          band: 'rgba(244,242,236,0.07)',
          band2: 'rgba(244,242,236,0.045)',
          ring: 'rgba(244,242,236,0.34)',
          ringFaint: 'rgba(244,242,236,0.18)',
          acc1: '#41d6d6',
          acc2: '#ff4f86',
          acc3: '#ffb45c',
          acc4: '#ff6a5a',
          redEdge: '#ff5a4e',
          redFill: 'rgba(255,106,90,0.18)',
          frag: 'rgba(244,242,236,0.5)',
          fragFill: 'rgba(10,12,16,0.6)',
          glitchR: 'rgba(255,106,90,0.55)',
          glitchC: 'rgba(65,214,214,0.5)',
          text: 'rgba(244,242,236,0.30)',
        },
      }
      var P = PAL[skin]

      /* ---- SVG composite, block-grouped for parallax ----
         viewBox centered on the composition; group depths:
         deep = core + big rings, mid = mid rings/triangles/text,
         near = fragments, near2 = glitch slices (closest to viewer). */
      var svg =
        '<svg viewBox="-600 -600 1200 1200" xmlns="http://www.w3.org/2000/svg">' +
        // ---- L1 DEEP: ring bands + mid ring + triangles + glitch slices ----
        '<g class="blk deep"><g id="geo-deepwrap">' +
        '<circle cx="0" cy="0" r="470" fill="none" stroke="' + P.band2 + '" stroke-width="30"/>' +
        '<circle cx="0" cy="0" r="415" fill="none" stroke="' + P.ringFaint + '" stroke-width="2"/>' +
        '<circle cx="0" cy="0" r="330" fill="none" stroke="' + P.band + '" stroke-width="26"/>' +
        '<circle cx="0" cy="0" r="283" fill="none" stroke="' + P.ringFaint + '" stroke-width="1.5" stroke-dasharray="3 10"/>' +
        '<g id="geo-midring">' +
        '<circle cx="0" cy="0" r="212" fill="none" stroke="' + P.ring + '" stroke-width="2" stroke-dasharray="40 14 8 14"/>' +
        '</g>' +
        '<polygon points="168,-142 214,-96 158,-88" fill="none" stroke="' + P.acc1 + '" stroke-width="2.5"/>' +
        '<polygon points="-204,118 -166,152 -206,166" fill="none" stroke="' + P.acc2 + '" stroke-width="2.5"/>' +
        '<polygon points="96,238 128,206 148,242" fill="none" stroke="' + P.acc3 + '" stroke-width="2"/>' +
        '<rect x="-560" y="-232" width="430" height="5" fill="' + P.glitchR + '"/>' +
        '<rect x="-556" y="-229" width="426" height="2" fill="' + P.glitchC + '"/>' +
        '<rect x="180" y="330" width="380" height="4" fill="' + P.glitchC + '"/>' +
        '<rect x="184" y="327" width="372" height="1.5" fill="' + P.glitchR + '"/>' +
        '<rect x="-260" y="420" width="300" height="3" fill="' + P.glitchR + '"/>' +
        '</g>' +
        '</g>' +
        // ---- L2 RED DIAMOND: the centre red rhombus (own parallax layer) ----
        '<g class="blk red"><g id="geo-redwrap">' +
        '<g id="geo-red">' +
        '<rect x="-150" y="-150" width="300" height="300" fill="none" stroke="' + P.redEdge + '" stroke-width="3" transform="rotate(45)"/>' +
        '<rect x="-92" y="-92" width="184" height="184" fill="none" stroke="' + P.redEdge + '" stroke-width="2" opacity="0.75" transform="rotate(45)"/>' +
        '<rect x="-44" y="-44" width="88" height="88" fill="' + P.redFill + '" transform="rotate(45)"/>' +
        '</g>' +
        '</g>' +
        '</g>' +
        // ---- L3 NEAR: fragments + dots + glyphs ----
        '<g class="blk near"><g id="geo-nearwrap">' +
        '<polygon points="252,-208 300,-188 288,-140 246,-156" fill="' + P.fragFill + '" stroke="' + P.frag + '" stroke-width="2"/>' +
        '<polygon points="330,64 368,80 350,116 312,102" fill="' + P.fragFill + '" stroke="' + P.acc1 + '" stroke-width="2"/>' +
        '<polygon points="244,262 282,250 294,290 254,300" fill="' + P.fragFill + '" stroke="' + P.frag + '" stroke-width="2"/>' +
        '<polygon points="-252,232 -220,262 -244,284" fill="' + P.fragFill + '" stroke="' + P.acc3 + '" stroke-width="2"/>' +
        '<polygon points="352,-300 386,-282 374,-246" fill="' + P.fragFill + '" stroke="' + P.frag + '" stroke-width="2"/>' +
        '<rect x="272" y="-60" width="26" height="26" fill="none" stroke="' + P.acc2 + '" stroke-width="2" transform="rotate(45 285 -47)"/>' +
        '<rect x="-330" y="-320" width="34" height="34" fill="none" stroke="' + P.ringFaint + '" stroke-width="2" transform="rotate(45 -313 -303)"/>' +
        '<g id="geo-drift">' +
        '<rect x="196" y="180" width="22" height="22" fill="' + P.coreFill + '" stroke="' + P.acc4 + '" stroke-width="1.5" transform="rotate(45 207 191)"/>' +
        '<circle cx="-160" cy="330" r="7" fill="' + P.acc4 + '"/>' +
        '<circle cx="310" cy="-140" r="5" fill="' + P.acc1 + '"/>' +
        '<circle cx="-40" cy="-350" r="6" fill="' + P.acc3 + '"/>' +
        '</g>' +
        '<text x="-470" y="-400" font-size="52" font-family="monospace" letter-spacing="10" fill="' + P.text + '">PRTS</text>' +
        '<text x="322" y="452" font-size="34" font-family="monospace" letter-spacing="6" fill="' + P.text + '">//SYNC</text>' +
        '</g>' +
        '</g>' +
        '</svg>'

      var bg = document.createElement('div')
      bg.className = 'prts-ui-bg'
      bg.setAttribute('aria-hidden', 'true')
      bg.innerHTML =
        '<div class="prts-ui-geo">' + svg + '</div>' +
        '<i class="prts-ui-grid"></i>' +
        '<i class="prts-ui-mark">PRTS</i>' +
        '<i class="prts-ui-corner a"></i>' +
        '<i class="prts-ui-corner b"></i>' +
        '<i class="prts-ui-vig"></i>'
      var geoEl = bg.querySelector('.prts-ui-geo')
      geoEl.style.setProperty('--geo-op', op)
      geoEl.style.setProperty('--geo-par', par)
      geoEl.style.setProperty('--geo-left', geoLeft)
      geoEl.style.setProperty('--geo-top', geoTop)
      document.body.appendChild(bg)

      /* bottom-left clickable PRTS logo → PRTS settings */
      var logo = document.createElement('a')
      logo.className = 'prts-ui-logo'
      logo.href = '#'
      logo.setAttribute('title', '直达 PRTS 设置')
      logo.innerHTML =
        '<i class="prts-ui-logo-mark"></i>' +
        '<span class="prts-ui-logo-word">PRTS</span>' +
        '<span class="prts-ui-logo-sub">SETTINGS</span>'
      logo.addEventListener('click', function (e) {
        e.preventDefault()
        console.log('[prts] logo clicked → open PRTS settings (settings.plugins.tab)')
      })
      document.body.appendChild(logo)

      /* Unified motion loop (rAF → SVG transform ATTRIBUTES only).
         Wrap groups get parallax translate; inner groups get idle motion. */
      var mxNow = mx
      var myNow = my
      var tSeed = params.get('t') !== null ? Number(params.get('t')) : 0
      var motionOn = params.get('motion') !== '0'
      var m0 = Date.now() - tSeed * 1000
      var wrapIds = [
        ['#geo-deepwrap', -6, -5],
        ['#geo-redwrap', -16, -12],
        ['#geo-nearwrap', -26, -18],
      ]
      var setTf = function (id, tf) {
        var el = bg.querySelector(id)
        if (el !== null) el.setAttribute('transform', tf)
      }
      var applyMotion = function (t) {
        var px, py
        for (var i = 0; i < wrapIds.length; i++) {
          px = wrapIds[i][1] * par * mxNow
          py = wrapIds[i][2] * par * myNow
          setTf(wrapIds[i][0], 'translate(' + px.toFixed(2) + ',' + py.toFixed(2) + ')')
        }
        if (!motionOn) return
        setTf('#geo-midring', 'rotate(' + (-(t / 72) * 360 % 360).toFixed(2) + ')')
        var rs = 1 + 0.03 * Math.sin((t / 6) * Math.PI * 2)
        setTf('#geo-red', 'rotate(' + ((t / 160) * 360 % 360).toFixed(2) + ') scale(' + rs.toFixed(4) + ')')
        var d1 = 0.5 - 0.5 * Math.cos((t / 26) * Math.PI * 2)
        setTf('#geo-drift', 'translate(' + (14 * d1).toFixed(2) + ',' + (-10 * d1).toFixed(2) + ')')
      }
      applyMotion(0)
      if (animate) {
        var tick = function () {
          var t = (Date.now() - m0) / 1000
          mxNow = Math.sin(t * 0.9) * 0.85
          myNow = Math.sin(t * 1.35 + 1.2) * 0.6
          applyMotion(t)
          requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
      } else {
        var idle = function () {
          var t = (Date.now() - m0) / 1000
          applyMotion(t)
          requestAnimationFrame(idle)
        }
        requestAnimationFrame(idle)
      }
      document.addEventListener('pointermove', function (e) {
        if (animate) return
        mxNow = (e.clientX / window.innerWidth) * 2 - 1
        myNow = (e.clientY / window.innerHeight) * 2 - 1
      })
    </script>
  </body>
</html>
